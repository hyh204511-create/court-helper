<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>法院立案/强执查询助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>法院立案/强执查询助手 <span id="app-version"></span></h1>
    <span id="login-status" class="badge badge-off">未登录</span>
  </header>

  <section class="actions">
    <button id="btn-import" class="primary">导入模板</button>
    <button id="btn-export">导出报表</button>
    <button id="btn-query" class="primary">开始查询</button>
  </section>

  <section class="login-controls">
    <div class="login-service-row">
      <span>本地登录服务</span>
      <span id="login-service-status" class="service-state" data-state="checking">检查中</span>
    </div>
    <label for="login-account">账号</label>
    <select id="login-account" aria-label="登录账号"></select>
    <button id="btn-auto-login" class="primary" disabled>一键登录</button>
    <div id="login-result" class="login-result" role="status"></div>
  </section>

  <section class="search">
    <input id="search-input" type="text" placeholder="账号 / 客户名">
    <select id="status-filter">
      <option value="">全部状态</option>
      <option>审核中</option>
      <option>立案成功</option>
      <option>强执成功</option>
      <option>已驳回</option>
      <option>UNKNOWN</option>
    </select>
    <button id="btn-search">查</button>
  </section>

  <section class="results">
    <table>
      <thead>
        <tr>
          <th>账号</th><th>客户名</th><th>类型</th><th>状态</th>
          <th>成功时间</th><th>案号</th><th>截图</th><th>查询时间</th>
        </tr>
      </thead>
      <tbody id="results-body">
        <tr><td colspan="8" class="empty">暂无数据 — 请先导入模板</td></tr>
      </tbody>
    </table>
  </section>

  <section class="batch">
    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-meta">
      <span id="progress-text">待处理: -</span>
      <button id="btn-pause" disabled>暂停</button>
    </div>
  </section>

  <script type="module" src="../dist/popup.bundle.js"></script>
</body>
</html>
