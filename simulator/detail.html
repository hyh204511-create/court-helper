<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>模拟-案件空间详情（驳回取证）</title></head>
<body>
  <!-- 依据 docs/engineering/platform-recon-2026-08-03.md §5.2/5.5 结构复刻 -->
  <div class="fd-com-header"><div class="fd-pc-first-header">
    <div class="fd-title-container">人民法院在线服务网</div>
    <div class="fd-header-operate">
      <div class="fd-select-area">浙江省</div>
      <div class="fd-user-name">测试原告</div>
      <div class="fd-exit">退出</div>
    </div>
  </div></div>
  <div class="fd-com-main-container fd-com-tab-bg">
    <uni-section title="审核结果">
      <div class="uni-forms-item"><div class="uni-forms-item__label">审核结果</div><div class="uni-forms-item__value">退回补充材料</div></div>
      <div class="uni-forms-item"><div class="uni-forms-item__label">审核时间</div><div class="uni-forms-item__value">2026-07-28 15:09:30</div></div>
      <div class="uni-forms-item"><div class="uni-forms-item__label">是否调解</div><div class="uni-forms-item__value">否</div></div>
      <div class="uni-forms-item"><div class="uni-forms-item__label">审核意见</div><div class="uni-forms-item__value">退回，请补充材料。</div></div>
    </uni-section>
    <uni-section title="基本信息">
      <div class="uni-forms-item"><div class="uni-forms-item__label">立案法院</div><div class="uni-forms-item__value">北京市丰台区人民法院</div></div>
      <div class="uni-forms-item"><div class="uni-forms-item__label">案件类型</div><div class="uni-forms-item__value">民事一审案件</div></div>
      <div class="uni-forms-item"><div class="uni-forms-item__label">立案案由</div><div class="uni-forms-item__value">买卖合同纠纷</div></div>
      <div class="uni-forms-item"><div class="uni-forms-item__label">标的金额(元)</div><div class="uni-forms-item__value">25000</div></div>
    </uni-section>
    <uni-section title="原告信息">
      <div class="uni-forms-item"><div class="uni-forms-item__label">姓名</div><div class="uni-forms-item__value">测试原告</div></div>
    </uni-section>
  </div>
</body>
</html>
